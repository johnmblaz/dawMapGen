<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ACKS D@W Tactical V48</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background: #1a1a1b; color: #d1d1d1; font-family: 'Courier New', monospace; overflow: hidden; }
        #wrapper { display: flex; flex-direction: column; height: 100vh; }
        #debug-container { background: #000; border-bottom: 2px solid #444; flex: 0 0 140px; overflow-y: auto; padding: 10px; font-size: 11px; color: #00ff00; box-sizing: border-box; }
        #controls { background: #252526; padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; border-bottom: 2px solid #3e3e42; flex: 0 0 auto; box-sizing: border-box; z-index: 10; }
        .control-group { display: flex; align-items: center; gap: 5px; border: 1px solid #444; padding: 3px 6px; border-radius: 4px; font-size: 10px; }
        button { cursor: pointer; padding: 4px 8px; background: #3e4a3e; color: white; border: 1px solid #5e6a5e; font-family: inherit; font-weight: bold; font-size: 10px; }
        button:hover { background: #4e5a4e; }
        select, input { padding: 2px; background: #2d2d30; color: white; border: 1px solid #3e3e42; font-family: inherit; font-size: 10px; }
        input[type="number"] { width: 35px; }
        #canvas-container { flex: 1; position: relative; overflow: hidden; background: #1a1a1b; }
        #legend { background: #1a1a1b; padding: 6px; display: flex; justify-content: center; gap: 12px; border-top: 1px solid #333; font-size: 10px; flex: 0 0 auto; box-sizing: border-box; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
    </style>
</head>
<body>

<div id="wrapper">
    <div id="debug-container"><div id="debug-panel">>> System Diagnostics Online...</div></div>
    <div id="controls">
        <div class="control-group">
            <label>Base:</label>
            <select id="terrainSelect">
                <option value="Clear or Grass">Clear/Grass</option>
                <option value="Barren">Barren</option>
                <option value="Desert">Desert</option>
                <option value="Hills">Hills</option>
                <option value="Scrub">Scrub</option>
                <option value="Woods">Woods</option>
                <option value="Mountains">Mntns</option>
                <option value="Jungle">Jungle</option>
                <option value="Swamp">Swamp</option>
            </select>
            <label><input type="checkbox" id="transparentCheck"> Transp.</label>
        </div>
        <div class="control-group">
            <label>Hex:</label><input type="number" id="sizeInput" value="18">
            <label>Line:</label><input type="number" id="borderInput" value="1">
            <label><input type="checkbox" id="gridCheck" checked> Grid</label>
            <label><input type="checkbox" id="iconCheck" checked> Icons</label>
        </div>
        <div class="control-group">
            <label>Coords:</label>
            <label><input type="checkbox" id="coordCheck"> Show</label>
            <label>Size:</label><input type="number" id="coordSizeInput" value="8">
        </div>
        <div class="control-group">
            <button id="btnColDec">-</button><span id="colVal">24</span><button id="btnColInc">+</button> W
            <button id="btnRowDec">-</button><span id="rowVal">18</span><button id="btnRowInc">+</button> H
        </div>
        <div class="control-group">
            <select id="orientSelect"><option value="flat">Flat</option><option value="pointy" selected>Pointy</option></select>
        </div>
        <button id="btnRoll" style="background: #5a4a3e;">Roll Map</button>
        <button id="btnExport" style="background: #2d2d30;">Export PNG</button>
    </div>
    <div id="canvas-container"></div>
    <div id="legend"></div>
</div>

<script>
let grid = [];
let linearFeatures = [];
let cols = 24, rows = 18;
let debugLog = [];

const terrainData = {
    "Clear or Grass": { color: [140, 142, 123], symbol: "" },
    "Barren": { color: [122, 115, 99], symbol: "" },
    "Desert": { color: [212, 184, 132], symbol: "" },
    "Hills": { color: [122, 124, 107], symbol: "∩" },
    "Scrub": { color: [166, 159, 136], symbol: "v" },
    "Woods": { color: [61, 77, 61], symbol: "♣" },
    "Mountains": { color: [94, 94, 94], symbol: "▲" },
    "Jungle": { color: [30, 51, 30], symbol: "♠" },
    "Swamp": { color: [74, 90, 90], symbol: "░" },
    "Broken": { color: [99, 93, 77], symbol: "∴" },
    "Cliff/Mountain": { color: [68, 68, 68], symbol: "▲" },
    "Forest/Jungle": { color: [45, 61, 45], symbol: "♣" },
    "Impenet. Forest": { color: [22, 33, 22], symbol: "♣♣" },
    "Mud": { color: [84, 73, 58], symbol: "~" },
    "Pond/Lake": { color: [74, 106, 138], symbol: "≋" },
    "Stream": { color: [90, 122, 154], symbol: "~" },
    "Trench": { color: [51, 51, 51], symbol: "═" },
    "Depression": { color: [105, 107, 90], symbol: "∪" }
};

function setup() {
    let container = document.getElementById('canvas-container');
    let canvas = createCanvas(container.clientWidth, container.clientHeight);
    canvas.parent('canvas-container');
    const ids = ['sizeInput', 'borderInput', 'coordCheck', 'transparentCheck', 'orientSelect', 'gridCheck', 'iconCheck', 'coordSizeInput'];
    ids.forEach(id => { document.getElementById(id).onchange = () => redraw(); });
    document.getElementById('btnColDec').onclick = () => changeDim('cols', -1);
    document.getElementById('btnColInc').onclick = () => changeDim('cols', 1);
    document.getElementById('btnRowDec').onclick = () => changeDim('rows', -1);
    document.getElementById('btnRowInc').onclick = () => changeDim('rows', 1);
    document.getElementById('btnRoll').onclick = generateMap;
    document.getElementById('btnExport').onclick = exportCroppedMap;
    createLegend();
    generateMap();
}

function changeDim(dim, amt) {
    if (dim === 'cols') cols = Math.max(5, cols + amt);
    if (dim === 'rows') rows = Math.max(5, rows + amt);
    document.getElementById('colVal').innerText = cols;
    document.getElementById('rowVal').innerText = rows;
    generateMap();
}

function createLegend() {
    const leg = document.getElementById('legend');
    leg.innerHTML = "";
    ["Broken", "Cliff/Mountain", "Forest/Jungle", "Hills", "Impenet. Forest", "Mud", "Pond/Lake", "Stream", "Swamp", "Trench"].forEach(key => {
        let item = document.createElement('div');
        item.className = 'legend-item';
        let c = terrainData[key].color;
        item.innerHTML = `<span style="color:rgb(${c[0]},${c[1]},${c[2]})">${terrainData[key].symbol || '■'}</span> ${key}`;
        leg.appendChild(item);
    });
}

function generateMap() {
    const baseType = document.getElementById('terrainSelect').value;
    grid = []; linearFeatures = []; debugLog = [];
    debugLog.push(`>> INITIALIZING ${baseType.toUpperCase()} FIELD...`);
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            grid.push({ c, r, layers: [baseType], mountainLevel: 0, isBaseOnly: true, passes: [] });
        }
    }
    const pieceCounts = {
        "Clear or Grass": [2, 4], "Barren": [3, 4], "Desert": [3, 4],
        "Hills": [4, 4], "Scrub": [4, 4], "Woods": [4, 6],
        "Mountains": [4, 8], "Jungle": [4, 8], "Swamp": [4, 8]
    };
    let dice = pieceCounts[baseType];
    let numFeatures = 0;
    for(let i = 0; i < dice[0]; i++) numFeatures += Math.floor(random(1, dice[1] + 1));
    let standardFeatures = [];
    let linearTypes = [];
    for (let i = 0; i < numFeatures; i++) {
        let f = rollFeatureTable(baseType);
        if (f === "Stream" || f === "Trench") linearTypes.push(f);
        else if (f) standardFeatures.push(f);
    }
    standardFeatures.forEach((f, idx) => placeFeatureAtScale(f, idx + 1));
    linearTypes.forEach((f, idx) => placeLinearFeature(f, standardFeatures.length + idx + 1));
    debugLog.push(">> GENERATION COMPLETE.");
    updateDebugPanel();
    redraw();
}

function rollFeatureTable(base) {
    let r = Math.floor(random(1, 21));
    if (base === "Clear or Grass") {
        if (r <= 4) return "Broken"; if (r <= 6) return "Cliff/Mountain"; if (r <= 8) return "Forest/Jungle"; if (r <= 14) return "Hills";
        if (r <= 16) return "Mud"; if (r <= 18) return "Pond/Lake"; if (r === 19) return "Stream"; if (r === 20) return "Swamp";
    }
    if (base === "Barren") { if (r <= 7) return "Broken"; if (r <= 12) return "Cliff/Mountain"; if (r <= 18) return "Hills"; if (r === 19) return "Mud"; if (r === 20) return "Trench"; }
    if (base === "Desert") { if (r <= 5) return "Broken"; if (r <= 10) return "Cliff/Mountain"; if (r <= 16) return "Hills"; if (r <= 18) return "Mud"; if (r >= 19) return "Trench"; }
    if (base === "Hills") { if (r <= 2) return "Broken"; if (r <= 4) return "Cliff/Mountain"; if (r <= 6) return "Forest/Jungle"; if (r <= 16) return "Hills"; if (r <= 18) return "Pond/Lake"; if (r >= 19) return "Stream"; }
    if (base === "Scrub") { if (r <= 2) return "Broken"; if (r <= 4) return "Cliff/Mountain"; if (r <= 8) return "Forest/Jungle"; if (r <= 16) return "Hills"; if (r === 17) return "Impenet. Forest"; if (r === 18) return "Pond/Lake"; if (r === 19) return "Stream"; if (r === 20) return "Trench"; }
    if (base === "Woods") { if (r <= 2) return "Broken"; if (r <= 4) return "Cliff/Mountain"; if (r <= 12) return "Forest/Jungle"; if (r <= 14) return "Hills"; if (r <= 17) return "Impenet. Forest"; if (r === 18) return "Pond/Lake"; if (r === 19) return "Stream"; if (r === 20) return "Swamp"; }
    if (base === "Mountains") { if (r <= 4) return "Broken"; if (r <= 10) return "Cliff/Mountain"; if (r <= 12) return "Forest/Jungle"; if (r <= 14) return "Hills"; if (r <= 16) return "Impenet. Forest"; if (r <= 18) return "Pond/Lake"; if (r === 19) return "Stream"; if (r === 20) return "Trench"; }
    if (base === "Jungle") { if (r <= 2) return "Cliff/Mountain"; if (r <= 10) return "Forest/Jungle"; if (r <= 12) return "Hills"; if (r <= 15) return "Impenet. Forest"; if (r === 16) return "Mud"; if (r === 17) return "Pond/Lake"; if (r <= 19) return "Stream"; if (r === 20) return "Swamp"; }
    if (base === "Swamp") { if (r <= 4) return "Forest/Jungle"; if (r <= 8) return "Impenet. Forest"; if (r <= 10) return "Mud"; if (r === 11) return "Pond/Lake"; if (r <= 13) return "Stream"; if (r <= 20) return "Swamp"; }
    return "Clear or Grass"; // Unified fallback
}

function placeLinearFeature(type, index) {
    let startC = Math.floor(random(cols)), startR = Math.floor(random(rows));
    let endC = Math.floor(random(cols)), endR = Math.floor(random(rows));
    let d6 = Math.floor(random(1, 7));
    let width = (d6 <= 3) ? 1 : (d6 <= 5) ? 2 : 3;
    let orient = document.getElementById('orientSelect').value;
    const baseType = document.getElementById('terrainSelect').value;

    const offsetToCube = (c, r) => {
        let x, z;
        if (orient === "pointy") { x = c - Math.floor(r / 2); z = r; } 
        else { x = c; z = r - Math.floor(c / 2); }
        return { x: x, y: -x - z, z: z };
    };
    const cubeRound = (cube) => {
        let rx = Math.round(cube.x), ry = Math.round(cube.y), rz = Math.round(cube.z);
        let xDiff = Math.abs(rx - cube.x), yDiff = Math.abs(ry - cube.y), zDiff = Math.abs(rz - cube.z);
        if (xDiff > yDiff && xDiff > zDiff) rx = -ry - rz; else if (yDiff > zDiff) ry = -rx - rz; else rz = -rx - ry;
        return { x: rx, y: ry, z: rz };
    };
    const cubeToOffset = (cube) => {
        let c, r;
        if (orient === "pointy") { c = cube.x + Math.floor(cube.z / 2); r = cube.z; } 
        else { c = cube.x; r = cube.z + Math.floor(cube.x / 2); }
        return { c, r };
    };

    let a = offsetToCube(startC, startR);
    let b = offsetToCube(endC, endR);
    let vec = { x: b.x - a.x, y: b.y - a.y, z: b.z - a.z };
    let mag = Math.max(Math.abs(vec.x), Math.abs(vec.y), Math.abs(vec.z));
    if (mag === 0) { vec = {x: 1, y: -1, z: 0}; mag = 1; }
    let unitVec = { x: vec.x / mag, y: vec.y / mag, z: vec.z / mag };

    const growDirection = (startCube, stepVec, isForward) => {
        let segmentPath = [];
        for (let i = 0; i < 60; i++) {
            let mult = isForward ? i : -i;
            let currentCube = cubeRound({ x: startCube.x + (stepVec.x * mult), y: startCube.y + (stepVec.y * mult), z: startCube.z + (stepVec.z * mult) });
            let coord = cubeToOffset(currentCube);
            let hex = grid.find(h => h.c === coord.c && h.r === coord.r);
            if (!hex) break;
            
            let topTerrain = hex.layers[hex.layers.length - 1];
            const isBlockedByTerrain = (topTerrain !== baseType) && (topTerrain !== "Clear or Grass") && ["Hills", "Mountains", "Pond/Lake", "Cliff/Mountain"].includes(topTerrain);
            const isBlockedByExistingPath = linearFeatures.some(feat => feat.path.some(n => n.c === hex.c && n.r === hex.r));

            if (i > 0 && (isBlockedByTerrain || isBlockedByExistingPath)) {
                segmentPath.push(hex); 
                break;
            }
            segmentPath.push(hex);
        }
        return segmentPath;
    };

    let forward = growDirection(a, unitVec, true);
    let backward = growDirection(a, unitVec, false);
    let fullPath = [...backward.reverse(), ...forward.slice(1)];

    if (fullPath.length > 1) {
        linearFeatures.push({ type, width, path: fullPath });
        debugLog.push(`${index}. ${type} (W:${width}) Vector: [${startC},${startR}] -> [${endC},${endR}]`);
    }
}

function getHexNeighbor(c, r, dir) {
    const orient = document.getElementById('orientSelect').value;
    const cubeDirs = [{x: +1, y: -1, z: 0}, {x: +1, y: 0, z: -1}, {x: 0, y: +1, z: -1}, {x: -1, y: +1, z: 0}, {x: -1, y: 0, z: +1}, {x: 0, y: -1, z: +1}];
    let x, z;
    if (orient === "pointy") { x = c - Math.floor(r / 2); z = r; } else { x = c; z = r - Math.floor(c / 2); }
    let d = cubeDirs[dir];
    let targetCube = { x: x + d.x, y: (-x - z) + d.y, z: z + d.z };
    let col, row;
    if (orient === "pointy") { col = targetCube.x + Math.floor(targetCube.z / 2); row = targetCube.z; } else { col = targetCube.x; row = targetCube.z + Math.floor(targetCube.x / 2); }
    return { c: col, r: row };
}

function placeFeatureAtScale(type, index) {
    let centerX = Math.floor(random(cols)), centerY = Math.floor(random(rows));
    let roll = random();
    let affectedCoords = [];
    let sizeLabel = "";
    affectedCoords.push({c: centerX, r: centerY});
    if (roll < 0.33) { sizeLabel = "Small"; } 
    else if (roll < 0.66) { 
        sizeLabel = "Medium"; 
        affectedCoords.push(getHexNeighbor(centerX, centerY, 0));
        affectedCoords.push(getHexNeighbor(centerX, centerY, 1));
    } 
    else { 
        sizeLabel = "Large"; 
        for (let i = 0; i < 6; i++) affectedCoords.push(getHexNeighbor(centerX, centerY, i));
    }
    debugLog.push(`${index}. ${type} (${sizeLabel}) at ${centerX},${centerY}.`);
    
    let hexesAffected = [];
    grid.forEach(hex => {
        if (affectedCoords.some(coord => coord.c === hex.c && coord.r === hex.r)) {
            hex.isBaseOnly = false;
            integrateTerrain(hex, type);
            hexesAffected.push(hex);
        }
    });

    if (type === "Cliff/Mountain" && sizeLabel !== "Small") {
        let passCount = (sizeLabel === "Medium") ? Math.floor(random(1, 3)) - 1 : Math.floor(random(1, 4)) - 1;
        for (let i = 0; i < passCount; i++) {
            let h = random(hexesAffected);
            let d = Math.floor(random(6));
            h.passes.push(d);
            let nCoord = getHexNeighbor(h.c, h.r, d);
            let n = grid.find(gh => gh.c === nCoord.c && gh.r === nCoord.r);
            if (n) n.passes.push((d + 3) % 6);
        }
    }
}

function integrateTerrain(hex, type) {
    const overlaps = { 
        "Broken": ["Hills"], 
        "Forest/Jungle": ["Hills", "Cliff/Mountain"], 
        "Cliff/Mountain": ["Cliff/Mountain", "Forest/Jungle"],
        "Hills": ["Broken", "Forest/Jungle"]
    };
    if (type === "Cliff/Mountain" && hex.layers.includes("Cliff/Mountain")) {
        hex.mountainLevel++;
        return;
    }
    if (overlaps[type] && overlaps[type].some(o => hex.layers.includes(o))) {
        if (!hex.layers.includes(type)) hex.layers.push(type);
    } else {
        hex.layers = [hex.layers[0], type];
    }
}

function updateDebugPanel() { 
    const panel = document.getElementById('debug-panel');
    panel.innerHTML = debugLog.join("<br>"); 
    document.getElementById('debug-container').scrollTop = document.getElementById('debug-container').scrollHeight;
}

function getHexPos(c, r, sz, orient) {
    let h = sz * Math.sqrt(3), x, y;
    if (orient === "flat") { x = c * (sz * 1.5); y = r * h + (c % 2 === 0 ? 0 : h / 2); } 
    else { y = r * (sz * 1.5); x = c * h + (r % 2 === 0 ? 0 : h / 2); }
    return { x, y };
}

function drawPathToContext(ctx, feat, sz, orient) {
    if (feat.path.length < 2) return;
    ctx.push(); ctx.noFill();
    ctx.stroke(feat.type === "Stream" ? '#4a90e2' : '#3d2b1f');
    ctx.strokeJoin(ROUND); ctx.strokeCap(ROUND);
    let finalWeight = (feat.width === 3) ? sz : (feat.width === 2) ? sz / 3 : sz * 0.10;
    ctx.strokeWeight(finalWeight);
    ctx.beginShape();
    feat.path.forEach(node => { let p = getHexPos(node.c, node.r, sz, orient); ctx.vertex(p.x, p.y); });
    ctx.endShape(); ctx.pop();
}

function drawHex(ctx, hex, sz, orient, mode) {
    let pos = getHexPos(hex.c, hex.r, sz, orient);
    
    // Core Fix 1: Force all un-featured map ground to be exactly the "Clear or Grass" unified color
    let data = hex.isBaseOnly ? terrainData["Clear or Grass"] : (terrainData[hex.layers[hex.layers.length - 1]] || terrainData["Clear or Grass"]);
    let isTrans = document.getElementById('transparentCheck').checked;
    
    if (mode === "fill") {
        ctx.push(); ctx.translate(pos.x, pos.y);
        if (hex.isBaseOnly && isTrans) ctx.noFill(); else ctx.fill(data.color[0], data.color[1], data.color[2]);
        ctx.noStroke(); if (orient === "pointy") ctx.rotate(PI / 6);
        ctx.beginShape(); for (let a = 0; a < TWO_PI; a += PI / 3) ctx.vertex(Math.cos(a) * (sz + 0.5), Math.sin(a) * (sz + 0.5));
        ctx.endShape(CLOSE); ctx.pop();
    } 
    if (mode === "overlay") {
        ctx.push(); ctx.translate(pos.x, pos.y); ctx.noFill();
        let baseWeight = parseInt(document.getElementById('borderInput').value);
        if (orient === "pointy") ctx.rotate(PI / 6);
        for (let i = 0; i < 6; i++) {
            let isPass = hex.passes.includes(i) && hex.layers.includes("Cliff/Mountain");
            ctx.stroke(isPass ? '#fff' : 40);
            ctx.strokeWeight(isPass ? baseWeight + 2 : baseWeight);
            if (!document.getElementById('gridCheck').checked && !isPass) continue;
            let a1 = i * PI/3, a2 = (i+1) * PI/3;
            ctx.line(Math.cos(a1)*sz, Math.sin(a1)*sz, Math.cos(a2)*sz, Math.sin(a2)*sz);
        }
        ctx.pop();

        if (document.getElementById('coordCheck').checked) {
            ctx.noStroke(); ctx.fill(255, 100); ctx.textAlign(CENTER, CENTER);
            ctx.textSize(parseInt(document.getElementById('coordSizeInput').value));
            ctx.text(`${hex.c},${hex.r}`, pos.x, pos.y + (sz * 0.5));
        }

        // Core Fix 2: Draw the icons over streams and trenches with a text shadow
        if (document.getElementById('iconCheck').checked && !hex.isBaseOnly) {
            let symbols = hex.layers.slice(1).map(l => (terrainData[l] || {}).symbol).filter(s => s && s !== "");
            let extraCarats = "^".repeat(hex.mountainLevel);
            let symbolText = symbols.join("") + extraCarats;
            
            if (symbolText.length > 0) {
                ctx.textAlign(CENTER, CENTER); 
                ctx.textSize(sz * 0.7);
                
                // Add a small drop shadow so it remains legible when a path crosses through
                ctx.noStroke();
                ctx.fill(0, 150);
                ctx.text(symbolText, pos.x + 1, pos.y + 1);
                
                // Main text color
                ctx.fill(255, 180); 
                ctx.text(symbolText, pos.x, pos.y);
            }
        }
    }
}

function draw() {
    let isTrans = document.getElementById('transparentCheck').checked;
    if (isTrans) clear(); else background(26);
    let sz = parseInt(document.getElementById('sizeInput').value);
    let orient = document.getElementById('orientSelect').value;
    push(); translate(60, 60);
    grid.forEach(hex => drawHex(window, hex, sz, orient, "fill"));
    linearFeatures.forEach(feat => drawPathToContext(window, feat, sz, orient));
    grid.forEach(hex => drawHex(window, hex, sz, orient, "overlay"));
    pop(); noLoop();
}

function exportCroppedMap() {
    let sz = parseInt(document.getElementById('sizeInput').value), orient = document.getElementById('orientSelect').value;
    let isTrans = document.getElementById('transparentCheck').checked;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    grid.forEach(h => { let p = getHexPos(h.c, h.r, sz, orient); minX = min(minX, p.x); minY = min(minY, p.y); maxX = max(maxX, p.x); maxY = max(maxY, p.y); });
    let margin = sz * 2;
    let off = createGraphics((maxX - minX) + (margin * 2), (maxY - minY) + (margin * 2));
    if (isTrans) off.clear(); else off.background(26);
    off.push(); off.translate(-minX + margin, -minY + margin);
    grid.forEach(hex => drawHex(off, hex, sz, orient, "fill"));
    linearFeatures.forEach(feat => drawPathToContext(off, feat, sz, orient));
    grid.forEach(hex => drawHex(off, hex, sz, orient, "overlay"));
    off.pop(); save(off, "acks-tactical.png");
}

function windowResized() { let container = document.getElementById('canvas-container'); resizeCanvas(container.clientWidth, container.clientHeight); redraw(); }
</script>
</body>
</html>
