<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ACKS D@W Map Gen</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { background: #1a1a1b; color: #d1d1d1; font-family: monospace; display: flex; flex-direction: column; align-items: center; margin: 0; }
        #controls { padding: 15px; background: #252526; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; border-bottom: 2px solid #3e3e42; }
        .control-group { display: flex; align-items: center; gap: 8px; border: 1px solid #444; padding: 5px 10px; border-radius: 4px; }
        button { cursor: pointer; padding: 5px 10px; background: #3e4a3e; color: white; border: 1px solid #5e6a5e; font-family: monospace; }
        button:hover { background: #4e5a4e; }
        select { padding: 8px; background: #2d2d30; color: white; border: 1px solid #3e3e42; }
        span { font-weight: bold; color: #fff; min-width: 20px; text-align: center; }
    </style>
</head>
<body>

<div id="controls">
    <div class="control-group">
        <label>Base: </label>
        <select id="terrainSelect">
            <option value="clear">Clear</option>
            <option value="woods">Woods</option>
            <option value="scrub">Scrub</option>
            <option value="swamp">Swamp</option>
            <option value="mountains">Mountains</option>
        </select>
    </div>

    <div class="control-group">
        <label>Width:</label>
        <button onclick="changeDim('cols', -1)">-</button>
        <span id="colVal">24</span>
        <button onclick="changeDim('cols', 1)">+</button>
    </div>

    <div class="control-group">
        <label>Height:</label>
        <button onclick="changeDim('rows', -1)">-</button>
        <span id="rowVal">18</span>
        <button onclick="changeDim('rows', 1)">+</button>
    </div>

    <button onclick="generateMap()" style="background: #5a4a3e; border-color: #7a6a5e;">Roll Terrain</button>
</div>

<script>
let grid = [];
let cols = 24;
let rows = 18;
const size = 18;

const palette = {
    clear: "#8c8e7b",
    woods: "#3d4d3d",
    scrub: "#a69f88",
    swamp: "#4a5a5a",
    mountains: "#5e5e5e"
};

function setup() {
    createCanvas(windowWidth, windowHeight - 120);
    generateMap();
}

function changeDim(dim, amt) {
    if (dim === 'cols') cols = max(5, cols + amt);
    if (dim === 'rows') rows = max(5, rows + amt);
    
    document.getElementById('colVal').innerText = cols;
    document.getElementById('rowVal').innerText = rows;
    
    generateMap(); // Re-generate immediately so you see the size change
}

function generateMap() {
    const baseType = document.getElementById('terrainSelect').value;
    grid = [];

    // 1. Create Grid based on current cols/rows
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            grid.push({ c, r, type: baseType });
        }
    }

    // 2. Roll Features
    let numFeatures = floor(random(2, 6));
    for (let i = 0; i < numFeatures; i++) {
        let featureType = getFeatureType(baseType);
        placeFeature(featureType);
    }
    redraw();
}

function getFeatureType(base) {
    const opts = { clear: "woods", woods: "clear", scrub: "clear", swamp: "woods", mountains: "scrub" };
    return opts[base] || "clear";
}

function placeFeature(type) {
    let centerX = floor(random(cols));
    let centerY = floor(random(rows));
    let radius = floor(random(1, 4));

    grid.forEach(hex => {
        let dx = hex.c - centerX;
        let dy = hex.r - centerY;
        let dist = (abs(dx) + abs(dx + dy) + abs(dy)) / 2;
        
        if (dist <= radius && random() > 0.1) {
            hex.type = type;
        }
    });
}

function draw() {
    background(26);
    grid.forEach(hex => {
        // Calculate Flat-Topped Hex Position
        let x = hex.c * size * 1.5 + 50;
        let y = hex.r * size * sqrt(3) + (hex.c % 2) * (size * sqrt(3) / 2) + 50;

        fill(palette[hex.type]);
        stroke(40);
        
        beginShape();
        for (let a = 0; a < TWO_PI; a += PI / 3) {
            vertex(x + cos(a) * size, y + sin(a) * size);
        }
        endShape(CLOSE);
    });
    noLoop();
}

function windowResized() {
    resizeCanvas(windowWidth, windowHeight - 120);
    redraw();
}
</script>
</body>
</html>
