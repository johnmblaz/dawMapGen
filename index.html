<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ACKS D@W Battlemap Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { background: #1a1a1b; color: #d1d1d1; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; margin: 0; overflow: hidden; }
        #controls { padding: 8px; background: #252526; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; border-bottom: 2px solid #3e3e42; box-sizing: border-box; z-index: 10; }
        .control-group { display: flex; align-items: center; gap: 5px; border: 1px solid #444; padding: 3px 6px; border-radius: 4px; font-size: 10px; }
        button { cursor: pointer; padding: 4px 8px; background: #3e4a3e; color: white; border: 1px solid #5e6a5e; font-family: inherit; font-weight: bold; font-size: 10px; }
        button:hover { background: #4e5a4e; }
        select, input { padding: 2px; background: #2d2d30; color: white; border: 1px solid #3e3e42; font-family: inherit; font-size: 10px; }
        input[type="number"] { width: 35px; }
        #debug-panel { width: 100%; background: #111; padding: 6px; font-size: 10px; color: #00ff00; border-bottom: 1px solid #333; height: 45px; overflow-y: auto; box-sizing: border-box; }
        #legend { width: 100%; background: #1a1a1b; padding: 8px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid #333; position: fixed; bottom: 0; }
        .legend-item { font-size: 10px; display: flex; align-items: center; gap: 4px; }
    </style>
</head>
<body>

<div id="controls">
    <div class="control-group">
        <label>Base:</label>
        <select id="terrainSelect">
            <option value="Clear or Grass">Clear/Grass</option>
            <option value="Barren">Barren</option>
            <option value="Desert">Desert</option>
            <option value="Hills">Hills</option>
            <option value="Scrub">Scrub</option>
            <option value="Woods">Woods</option>
            <option value="Mountains">Mntns</option>
            <option value="Jungle">Jungle</option>
            <option value="Swamp">Swamp</option>
        </select>
        <label><input type="checkbox" id="transparentCheck"> Transp.</label>
    </div>
    <div class="control-group">
        <label>Hex:</label><input type="number" id="sizeInput" value="18">
        <label>Line:</label><input type="number" id="borderInput" value="1">
        <label><input type="checkbox" id="gridCheck" checked> Grid</label>
        <label><input type="checkbox" id="iconCheck" checked> Icons</label>
    </div>
    <div class="control-group">
        <label>Coords:</label>
        <label><input type="checkbox" id="coordCheck"> Show</label>
        <label>Size:</label><input type="number" id="coordSizeInput" value="8">
        <label>Pos:</label>
        <select id="coordPos">
            <option value="center">Center</option>
            <option value="top">Top</option>
            <option value="bottom">Bottom</option>
        </select>
    </div>
    <div class="control-group">
        <button id="btnColDec">-</button><span id="colVal">24</span><button id="btnColInc">+</button>
        <button id="btnRowDec">-</button><span id="rowVal">18</span><button id="btnRowInc">+</button>
    </div>
    <div class="control-group">
        <select id="orientSelect"><option value="flat">Flat</option><option value="pointy">Pointy</option></select>
        <select id="offsetSelect"><option value="even">Even</option><option value="odd">Odd</option></select>
    </div>
    <button id="btnRoll" style="background: #5a4a3e;">Roll</button>
    <button id="btnExport" style="background: #2d2d30;">Export PNG</button>
</div>

<div id="debug-panel">Ready.</div>
<div id="legend"></div>

<script>
let grid = [];
let cols = 24, rows = 18;

const terrainData = {
    "Clear or Grass": { color: [140, 142, 123], symbol: "" },
    "Barren": { color: [122, 115, 99], symbol: "" },
    "Desert": { color: [212, 184, 132], symbol: "" },
    "Hills": { color: [122, 124, 107], symbol: "∩" },
    "Scrub": { color: [166, 159, 136], symbol: "v" },
    "Woods": { color: [61, 77, 61], symbol: "♣" },
    "Mountains": { color: [94, 94, 94], symbol: "▲" },
    "Jungle": { color: [30, 51, 30], symbol: "♠" },
    "Swamp": { color: [74, 90, 90], symbol: "░" },
    "Broken": { color: [99, 93, 77], symbol: "∴" },
    "Cliff/Mountain": { color: [68, 68, 68], symbol: "▲▲" },
    "Forest/Jungle": { color: [45, 61, 45], symbol: "♣" },
    "Impenet. Forest": { color: [22, 33, 22], symbol: "♣♣" },
    "Mud": { color: [84, 73, 58], symbol: "≡" },
    "Pond/Lake": { color: [74, 106, 138], symbol: "o" },
    "Stream": { color: [90, 122, 154], symbol: "~" },
    "Trench": { color: [51, 51, 51], symbol: "═" }
};

function setup() {
    createCanvas(windowWidth, windowHeight - 150);
    
    // Clear event listeners then re-bind
    const ids = ['sizeInput', 'borderInput', 'coordCheck', 'transparentCheck', 'orientSelect', 'offsetSelect', 'gridCheck', 'iconCheck', 'coordSizeInput', 'coordPos'];
    ids.forEach(id => {
        const el = document.getElementById(id);
        el.onchange = () => redraw();
    });

    document.getElementById('btnColDec').onclick = () => changeDim('cols', -1);
    document.getElementById('btnColInc').onclick = () => changeDim('cols', 1);
    document.getElementById('btnRowDec').onclick = () => changeDim('rows', -1);
    document.getElementById('btnRowInc').onclick = () => changeDim('rows', 1);
    document.getElementById('btnRoll').onclick = generateMap;
    document.getElementById('btnExport').onclick = exportCroppedMap;
    
    createLegend();
    generateMap();
}

function changeDim(dim, amt) {
    if (dim === 'cols') cols = Math.max(5, cols + amt);
    if (dim === 'rows') rows = Math.max(5, rows + amt);
    document.getElementById('colVal').innerText = cols;
    document.getElementById('rowVal').innerText = rows;
    generateMap();
}

function createLegend() {
    const leg = document.getElementById('legend');
    leg.innerHTML = "";
    ["Broken", "Cliff/Mountain", "Forest/Jungle", "Hills", "Impenet. Forest", "Mud", "Pond/Lake", "Stream", "Swamp", "Trench"].forEach(key => {
        let item = document.createElement('div');
        item.className = 'legend-item';
        let c = terrainData[key].color;
        item.innerHTML = `<span style="color:rgb(${c[0]},${c[1]},${c[2]})">${terrainData[key].symbol}</span> ${key}`;
        leg.appendChild(item);
    });
}

function rollDice(num, sides) {
    let total = 0;
    for(let i=0; i<num; i++) total += Math.floor(random(1, sides + 1));
    return total;
}

function generateMap() {
    const baseType = document.getElementById('terrainSelect').value;
    grid = [];
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            grid.push({ c, r, type: baseType, isBase: true });
        }
    }

    // Battlemap Piece Counts per your provided table
    const pieceCounts = {
        "Clear or Grass": [2, 4], "Barren": [3, 4], "Desert": [3, 4],
        "Hills": [4, 4], "Scrub": [4, 4], "Woods": [4, 6],
        "Mountains": [4, 8], "Jungle": [4, 8], "Swamp": [4, 8]
    };
    
    let dice = pieceCounts[baseType];
    let numFeatures = rollDice(dice[0], dice[1]);
    let log = [`>> Rolled ${dice[0]}d${dice[1]} for ${baseType}: ${numFeatures} pieces.`];
    
    for (let i = 0; i < numFeatures; i++) {
        let feature = rollFeatureTable(baseType);
        if (feature) {
            log.push(` + ${feature}`);
            placeFeature(feature);
        }
    }
    
    document.getElementById('debug-panel').innerHTML = log.join("<br>");
    redraw();
}

function rollFeatureTable(base) {
    let r = Math.floor(random(1, 21));
    if (base === "Clear or Grass") {
        if (r <= 4) return "Broken"; if (r <= 6) return "Cliff/Mountain"; if (r <= 8) return "Forest/Jungle"; if (r <= 14) return "Hills";
        if (r <= 16) return "Mud"; if (r <= 18) return "Pond/Lake"; if (r === 19) return "Stream"; if (r === 20) return "Swamp";
    }
    if (base === "Barren") { if (r <= 7) return "Broken"; if (r <= 12) return "Cliff/Mountain"; if (r <= 18) return "Hills"; if (r === 19) return "Mud"; if (r === 20) return "Trench"; }
    if (base === "Desert") { if (r <= 5) return "Broken"; if (r <= 10) return "Cliff/Mountain"; if (r <= 16) return "Hills"; if (r <= 18) return "Mud"; if (r >= 19) return "Trench"; }
    if (base === "Hills") { if (r <= 2) return "Broken"; if (r <= 4) return "Cliff/Mountain"; if (r <= 6) return "Forest/Jungle"; if (r <= 16) return "Hills"; if (r <= 18) return "Pond/Lake"; if (r >= 19) return "Stream"; }
    if (base === "Scrub") { if (r <= 2) return "Broken"; if (r <= 4) return "Cliff/Mountain"; if (r <= 8) return "Forest/Jungle"; if (r <= 16) return "Hills"; if (r === 17) return "Impenet. Forest"; if (r === 18) return "Pond/Lake"; if (r === 19) return "Stream"; if (r === 20) return "Trench"; }
    if (base === "Woods") { if (r <= 2) return "Broken"; if (r <= 4) return "Cliff/Mountain"; if (r <= 12) return "Forest/Jungle"; if (r <= 14) return "Hills"; if (r <= 17) return "Impenet. Forest"; if (r === 18) return "Pond/Lake"; if (r === 19) return "Stream"; if (r === 20) return "Swamp"; }
    if (base === "Mountains") { if (r <= 4) return "Broken"; if (r <= 10) return "Cliff/Mountain"; if (r <= 12) return "Forest/Jungle"; if (r <= 14) return "Hills"; if (r <= 16) return "Impenet. Forest"; if (r <= 18) return "Pond/Lake"; if (r === 19) return "Stream"; if (r === 20) return "Trench"; }
    if (base === "Jungle") { if (r <= 2) return "Cliff/Mountain"; if (r <= 10) return "Forest/Jungle"; if (r <= 12) return "Hills"; if (r <= 15) return "Impenet. Forest"; if (r === 16) return "Mud"; if (r === 17) return "Pond/Lake"; if (r <= 19) return "Stream"; if (r === 20) return "Swamp"; }
    if (base === "Swamp") { if (r <= 4) return "Forest/Jungle"; if (r <= 8) return "Impenet. Forest"; if (r <= 10) return "Mud"; if (r === 11) return "Pond/Lake"; if (r <= 13) return "Stream"; if (r <= 20) return "Swamp"; }
    return null;
}

function placeFeature(type) {
    let centerX = Math.floor(random(cols)), centerY = Math.floor(random(rows));
    let radius = Math.floor(random(1, 4));
    grid.forEach(hex => {
        let dx = hex.c - centerX, dy = hex.r - centerY;
        let dist = (Math.abs(dx) + Math.abs(dx + dy) + Math.abs(dy)) / 2;
        if (dist <= radius && random() > 0.15) { hex.type = type; hex.isBase = false; }
    });
}

function getHexPos(c, r, sz, orient, offset) {
    let h = sz * Math.sqrt(3), x, y;
    if (orient === "flat") {
        x = c * (sz * 1.5);
        let stagger = (offset === "even") ? (c % 2 === 0 ? 0 : h / 2) : (c % 2 !== 0 ? 0 : h / 2);
        y = r * h + stagger;
    } else {
        y = r * (sz * 1.5);
        let stagger = (offset === "even") ? (r % 2 === 0 ? 0 : h / 2) : (r % 2 !== 0 ? 0 : h / 2);
        x = c * h + stagger;
    }
    return { x, y };
}

function drawHex(ctx, hex, sz, orient, offset, minX, minY, margin, isExport) {
    let pos = getHexPos(hex.c, hex.r, sz, orient, offset);
    let x = isExport ? (pos.x - minX + margin) : (pos.x + 50);
    let y = isExport ? (pos.y - minY + margin) : (pos.y + 50);
    
    let data = terrainData[hex.type];
    let isTrans = document.getElementById('transparentCheck').checked;
    let bWidth = parseInt(document.getElementById('borderInput').value);
    let showCoords = document.getElementById('coordCheck').checked;
    let showIcons = document.getElementById('iconCheck').checked;
    let showGrid = document.getElementById('gridCheck').checked;
    let cSize = parseInt(document.getElementById('coordSizeInput').value);
    let cPos = document.getElementById('coordPos').value;

    ctx.push();
    ctx.translate(x, y);
    
    if (hex.isBase && isTrans) ctx.noFill();
    else ctx.fill(data.color[0], data.color[1], data.color[2]);
    
    if (showGrid) { ctx.stroke(40); ctx.strokeWeight(bWidth); } else { ctx.noStroke(); }
    
    if (orient === "pointy") ctx.rotate(PI / 6);
    ctx.beginShape();
    for (let a = 0; a < TWO_PI; a += PI / 3) ctx.vertex(Math.cos(a) * sz, Math.sin(a) * sz);
    ctx.endShape(CLOSE);
    ctx.pop();

    ctx.noStroke(); ctx.textAlign(CENTER, CENTER);
    if (showIcons && data.symbol) {
        ctx.fill(255, 140); ctx.textSize(sz * 0.7);
        ctx.text(data.symbol, x, y);
    }
    
    if (showCoords) {
        ctx.fill(255, 100); ctx.textSize(cSize);
        let cy = y;
        if(cPos === "top") cy = y - (sz * 0.6);
        if(cPos === "bottom") cy = y + (sz * 0.6);
        ctx.text(`${hex.c},${hex.r}`, x, cy);
    }
}

function draw() {
    background(26);
    let sz = parseInt(document.getElementById('sizeInput').value);
    let orient = document.getElementById('orientSelect').value;
    let offset = document.getElementById('offsetSelect').value;
    grid.forEach(hex => drawHex(this, hex, sz, orient, offset, 0, 0, 0, false));
    noLoop();
}

function exportCroppedMap() {
    let sz = parseInt(document.getElementById('sizeInput').value);
    let orient = document.getElementById('orientSelect').value;
    let offset = document.getElementById('offsetSelect').value;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

    grid.forEach(h => {
        let p = getHexPos(h.c, h.r, sz, orient, offset);
        minX = min(minX, p.x); minY = min(minY, p.y);
        maxX = max(maxX, p.x); maxY = max(maxY, p.y);
    });

    let margin = sz * 1.5, w = (maxX - minX) + (margin * 2), h = (maxY - minY) + (margin * 2);
    let off = createGraphics(w, h);
    if (!document.getElementById('transparentCheck').checked) off.background(26);
    grid.forEach(hex => drawHex(off, hex, sz, orient, offset, minX, minY, margin, true));
    save(off, "acks-dw-map.png");
}

function windowResized() { resizeCanvas(windowWidth, windowHeight - 150); redraw(); }
</script>
</body>
</html>
